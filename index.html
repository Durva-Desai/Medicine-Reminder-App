<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare 🎉 - Smart Medicine Alarm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
            background: linear-gradient(-45deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24, #f0932b, #eb4d4b);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes ring {
            0% { transform: rotate(-12deg); }
            10% { transform: rotate(12deg); }
            20% { transform: rotate(-8deg); }
            30% { transform: rotate(8deg); }
            40% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
            60% { transform: rotate(0); }
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: bounce 2s infinite;
        }

        .header {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            color: #d63384;
            padding: 35px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '🩺💊🎉';
            position: absolute;
            top: -50px;
            right: -50px;
            font-size: 60px;
            animation: ring 2s linear infinite;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .nav-tabs {
            display: flex;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .tab {
            flex: 1;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            color: white;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        .tab:hover::before {
            left: 100%;
        }

        .tab.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            transform: scale(1.05);
        }

        .tab-content {
            padding: 35px;
            display: none;
            min-height: 400px;
        }

        .tab-content.active {
            display: block;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: #333;
            font-size: 16px;
        }

        input, select {
            width: 100%;
            padding: 18px;
            border: 3px solid #e1e5e9;
            border-radius: 20px;
            font-size: 18px;
            transition: all 0.3s;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
            transform: scale(1.02);
        }

        .time-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 18px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            animation: pulse 2s infinite;
        }

        .btn-primary:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
            animation: shake 0.5s infinite;
        }

        .btn-alarm {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 24px;
            padding: 25px;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            margin: 20px auto;
            display: block;
            animation: ring 1s linear infinite;
        }

        .medicine-card {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 20px;
            border: 4px solid transparent;
            background-clip: padding-box;
            position: relative;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .medicine-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24, #f0932b);
            border-radius: 27px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .medicine-card:hover::before {
            opacity: 1;
        }

        .medicine-card.due {
            animation: shake 0.5s infinite;
            border-color: #ff4757;
            transform: scale(1.05);
        }

        .medicine-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .medicine-name {
            font-size: 24px;
            font-weight: 800;
            color: #2d3436;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .medicine-time {
            color: #e17055;
            font-weight: 800;
            font-size: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .medicine-dosage {
            color: #636e72;
            font-size: 16px;
            font-weight: 600;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-small {
            padding: 12px 20px;
            font-size: 14px;
            border-radius: 15px;
            flex: none;
        }

        .status-badge {
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .status-upcoming { 
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white;
            animation: pulse 2s infinite;
        }
        .status-due { 
            background: linear-gradient(135deg, #ff7675 0%, #fd79a8 100%);
            color: white;
            animation: shake 0.8s infinite;
        }
        .status-taken { 
            background: linear-gradient(135deg, #00b894 0%, #55a3ff 100%);
            color: white;
        }
        .status-missed { 
            background: linear-gradient(135deg, #e17055 0%, #d63031 100%);
            color: white;
            animation: shake 1s infinite;
        }

        .history-list {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .history-list::-webkit-scrollbar {
            width: 8px;
        }

        .history-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 30px;
            color: #636e72;
            animation: bounce 2s infinite;
        }

        .empty-state div {
            font-size: 80px;
            display: block;
            margin-bottom: 25px;
        }

        /* ALARM MODAL */
        .alarm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: pulse 1s infinite;
        }

        .alarm-modal.show {
            display: flex;
        }

        .alarm-content {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #ff9ff3 100%);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: ring 0.5s linear infinite;
        }

        .alarm-emoji {
            font-size: 100px;
            margin-bottom: 20px;
            animation: bounce 0.6s infinite;
        }

        .alarm-title {
            font-size: 32px;
            font-weight: 800;
            color: white;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .alarm-medicine {
            font-size: 24px;
            color: white;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 25px 30px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #d63384;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.4);
            transform: translateX(400px);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            max-width: 350px;
            font-weight: 700;
            border: 3px solid rgba(255,255,255,0.5);
        }

        .notification.show {
            transform: translateX(0) scale(1.05);
            animation: bounce 0.6s;
        }

        @media (max-width: 480px) {
            .container { margin: 10px; border-radius: 20px; }
            .header h1 { font-size: 26px; }
            .alarm-content { padding: 30px 20px; }
            .alarm-emoji { font-size: 70px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🩺 MediCare 🎉</h1>
            <p>Never miss your dose again! 💊✨</p>
        </div>

        <div class="nav-tabs">
            <div class="tab active" onclick="switchTab('home')">🏠 Home</div>
            <div class="tab" onclick="switchTab('add')">➕ Add Medicine</div>
            <div class="tab" onclick="switchTab('history')">📋 History</div>
        </div>

        <!-- Home Tab -->
        <div id="home" class="tab-content active">
            <div id="medicines-list">
                <div class="empty-state">
                    <div>💊🎈</div>
                    <h3>No medicines yet!</h3>
                    <p>Add your first colorful reminder 🎉</p>
                    <button class="btn btn-primary" onclick="switchTab('add')">➕ Add Medicine</button>
                </div>
            </div>
        </div>

        <!-- Add Medicine Tab -->
        <div id="add" class="tab-content">
            <form id="medicineForm">
                <div class="form-group">
                    <label>💊 Medicine Name</label>
                    <input type="text" id="medicineName" placeholder="e.g., Vitamin C" required>
                </div>
                
                <div class="form-group">
                    <label>📦 Dosage</label>
                    <input type="text" id="dosage" placeholder="e.g., 1 tablet, 500mg" required>
                </div>

                <div class="form-group">
                    <label>⏰ Time</label>
                    <div class="time-group">
                        <input type="time" id="time" required>
                        <select id="repeat">
                            <option value="daily">🔄 Daily</option>
                            <option value="weekly">📅 Weekly</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">🎉 Add Reminder!</button>
            </form>
        </div>

        <!-- History Tab -->
        <div id="history" class="tab-content">
            <div class="history-list" id="historyList">
                <div class="empty-state">
                    <div>📋🎈</div>
                    <h3>No history yet!</h3>
                    <p>Your colorful journey starts here ✨</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="notification" class="notification">
        <strong id="notifTitle"></strong>
        <p id="notifMessage"></p>
    </div>

    <!-- FULLSCREEN ALARM MODAL 🎵🔊 -->
    <div id="alarmModal" class="alarm-modal">
        <div class="alarm-content">
            <div class="alarm-emoji" id="alarmEmoji">🚨</div>
            <div class="alarm-title" id="alarmTitle">MEDICINE TIME!</div>
            <div class="alarm-medicine" id="alarmMedicine"></div>
            <div class="action-buttons" style="grid-template-columns: 1fr;">
                <button class="btn btn-success btn-alarm" onclick="app.snoozeAlarm()">
                    ✅ I TOOK IT!
                </button>
                <button class="btn btn-danger btn-alarm" onclick="app.missAlarm()">
                    ❌ MISSED IT
                </button>
                <button class="btn btn-primary btn-alarm" onclick="app.snoozeAlarm()">
                    ⏰ SNOOZE 10min
                </button>
            </div>
        </div>
    </div>

    <!-- Audio Context for Alarm Sound -->
    <audio id="alarmSound" preload="auto" loop>
        <source src="data:audio/wav;base64,UklGRoQCAABXQVZFZm10IBAAAAABAAADqkAAkAAABAAADABAAZGF0YQoCAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAo" type="audio/wav">
    </audio>

    <script>
        class MedicineReminder {
            constructor() {
                this.medicines = JSON.parse(localStorage.getItem('medicines')) || [];
                this.history = JSON.parse(localStorage.getItem('history')) || [];
                this.alarmActive = false;
                this.snoozeTime = null;
                this.init();
            }

            init() {
                this.renderMedicines();
                this.renderHistory();
                this.bindEvents();
                this.startAlarmChecking();
                this.requestPermissions();
            }

            requestPermissions() {
                if ('Notification' in window) {
                    Notification.requestPermission();
                }
                if ('vibrate' in navigator) {
                    console.log('✅ Vibration supported!');
                }
            }

            bindEvents() {
                document.getElementById('medicineForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addMedicine();
                });
            }

            playAlarmSound() {
                const audio = document.getElementById('alarmSound');
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Audio play failed:', e));
            }

            stopAlarmSound() {
                const audio = document.getElementById('alarmSound');
                audio.pause();
                audio.currentTime = 0;
            }

            vibratePattern(pattern = [200, 100, 200]) {
                if ('vibrate' in navigator) {
                    navigator.vibrate(pattern);
                }
            }

            showFullAlarm(medicine) {
                if (this.alarmActive) return;
                
                this.alarmActive = true;
                document.getElementById('alarmEmoji').textContent = '🚨💊';
                document.getElementById('alarmTitle').textContent = 'MEDICINE TIME!!!';
                document.getElementById('alarmMedicine').textContent = `${medicine.name} (${medicine.dosage})`;
                
                const modal = document.getElementById('alarmModal');
                modal.classList.add('show');
                
                // Start alarm effects
                this.playAlarmSound();
                this.vibratePattern([200, 100, 200, 100, 200]);
                
                // Continuous vibration every 2 seconds
                const vibeInterval = setInterval(() => {
                    this.vibratePattern([500]);
                }, 2000);
                
                // Auto snooze after 5 minutes if not dismissed
                setTimeout(() => {
                    clearInterval(vibeInterval);
                    this.dismissAlarm(medicine.id, 'snoozed');
                }, 5 * 60 * 1000);
            }

            snoozeAlarm() {
                this.dismissAlarm(null, 'snoozed');
                this.showNotification('⏰ SNOOZED!', 'Reminder in 10 minutes! 😴');
                this.snoozeTime = Date.now() + 10 * 60 * 1000;
            }

            missAlarm() {
                this.dismissAlarm(null, 'missed');
            }

            dismissAlarm(medicineId, action) {
                this.alarmActive = false;
                this.stopAlarmSound();
                document.getElementById('alarmModal').classList.remove('show');
                
                if (medicineId) {
                    const medicine = this.medicines.find(m => m.id === medicineId);
                    if (medicine && action === 'taken') {
                        this.markTaken(medicineId);
                    } else if (action === 'missed') {
                        this.markMissed(medicineId);
                    }
                }
            }

            startAlarmChecking() {
                // Check every 30 seconds for due medicines
                setInterval(() => this.checkAlarms(), 30000);
                // Also check immediately
                this.checkAlarms();
            }

            checkAlarms() {
                const now = new Date();
                this.medicines.forEach(medicine => {
                    if (medicine.status === 'taken' || medicine.status === 'snoozed') return;
                    
                    const [hours, minutes] = medicine.time.split(':');
                    let reminderTime = new Date();
                    reminderTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
                    
                    // Handle next day
                    if (reminderTime < now) {
                        reminderTime.setDate(reminderTime.getDate() + 1);
                    }
                    
                    const timeDiff = reminderTime - now;
                    
                    // EXACT TIME ALARM (within 1 minute)
                    if (timeDiff <= 60 * 1000 && timeDiff > 0) {
                        medicine.status = 'due';
                        this.saveData();
                        this.renderMedicines();
                        this.showFullAlarm(medicine);
                        return;
                    }
                    
                    // 5 minutes before - notification only
                    if (timeDiff <= 5 * 60 * 1000 && timeDiff > 60 * 1000) {
                        if (medicine.status !== 'due') {
                            medicine.status = 'due';
                            this.saveData();
                            this.renderMedicines();
                            this.showNotification('⏰ Almost time!', 
                                `Take ${medicine.name} (${medicine.dosage}) in 5 minutes!`);
                        }
                    }
                    
                    // MISSED DOSE CHECK (if more than 30 min late)
                    if (timeDiff < -30 * 60 * 1000 && medicine.status !== 'missed' && medicine.status !== 'taken') {
                        medicine.status = 'missed';
                        this.saveData();
                        this.renderMedicines();
                        this.showMissedDoseAlarm(medicine);
                    }
                });
            }

            showMissedDoseAlarm(medicine) {
                this.showNotification('😢 MISSED DOSE!', 
                    `${medicine.name} was due ${medicine.time}! Take it now if possible!`);
                this.vibratePattern([1000, 500, 1000]);
            }

            addMedicine() {
                const name = document.getElementById('medicineName').value;
                const dosage = document.getElementById('dosage').value;
                const time = document.getElementById('time').value;
                const repeat = document.getElementById('repeat').value;

                const medicine = {
                    id: Date.now(),
                    name,
                    dosage,
                    time,
                    repeat,
                    status: 'upcoming',
                    createdAt: new Date().toISOString()
                };

                this.medicines.unshift(medicine);
                this.saveData();
                this.renderMedicines();
                this.showNotification('🎉 Medicine Added!', `${name} reminder is ready!`);
                
                document.getElementById('medicineForm').reset();
                switchTab('home');
            }

            markTaken(id) {
                const medicine = this.medicines.find(m => m.id === id);
                if (medicine) {
                    medicine.status = 'taken';
                    this.addToHistory(medicine, 'taken');
                    this.saveData();
                    this.renderMedicines();
                    this.vibratePattern([100, 50, 100, 50]);
                    this.showNotification('✅ Perfect!', `${medicine.name} - Well done! 🎉`);
                }
            }

            markMissed(id) {
                const medicine = this.medicines.find(m => m.id === id);
                if (medicine) {
                    medicine.status = 'missed';
                    this.addToHistory(medicine, 'missed');
                    this.saveData();
                    this.renderMedicines();
                    this.vibratePattern([300, 100, 300]);
                }
            }

            deleteMedicine(id) {
                this.medicines = this.medicines.filter(m => m.id !== id);
                this.saveData();
                this.renderMedicines();
            }

            editMedicine(id) {
                const medicine = this.medicines.find(m => m.id === id);
                if (medicine) {
                    document.getElementById('medicineName').value = medicine.name;
                    document.getElementById('dosage').value = medicine.dosage;
                    document.getElementById('time').value = medicine.time;
                    document.getElementById('repeat').value = medicine.repeat;
                    this.deleteMedicine(id);
                    switchTab('add');
                }
            }

            addToHistory(medicine, action) {
                this.history.unshift({
                    ...medicine,
                    action,
                    timestamp: new Date().toLocaleString()
                });
                if (this.history.length > 100) {
                    this.history = this.history.slice(0, 100);
                }
            }

            getStatusClass(status) {
                return `status-${status}`;
            }

            getStatusBadge(status) {
                const labels = {
                    upcoming: '⏳ Upcoming',
                    due: '🚨 NOW!',
                    taken: '✅ Taken',
                    missed: '😢 Missed'
                };
                const classes = {
                    upcoming: 'status-upcoming',
                    due: 'status-due',
                    taken: 'status-taken',
                    missed: 'status-missed'
                };
                return `<span class="status-badge ${classes[status]}">${labels[status]}</span>`;
            }

            renderMedicines() {
                const container = document.getElementById('medicines-list');
                if (this.medicines.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div>💊🎈</div>
                            <h3>No medicines yet!</h3>
                            <p>Add your first colorful reminder 🎉</p>
                            <button class="btn btn-primary" onclick="switchTab('add')">➕ Add Medicine</button>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = this.medicines.map(medicine => {
                    const isDue = medicine.status === 'due';
                    return `
                        <div class="medicine-card ${isDue ? 'due' : ''}" style="animation: ${isDue ? 'shake 0.5s infinite' : 'none'};">
                            <div class="medicine-header">
                                <div>
                                    <div class="medicine-name">${medicine.name}</div>
                                    <div class="medicine-dosage">${medicine.dosage} • ${medicine.repeat}</div>
                                </div>
                                <div class="medicine-time">${medicine.time} ⏰</div>
                            </div>
                            ${this.getStatusBadge(medicine.status)}
                            
                            <div class="action-buttons">
                                ${medicine.status !== 'taken' ? `
                                    <button class="btn btn-success btn-small" onclick="app.markTaken(${medicine.id})">
                                        ✅ Took it!
                                    </button>
                                    <button class="btn btn-danger btn-small" onclick="app.markMissed(${medicine.id})">
                                        ❌ Missed
                                    </button>
                                ` : ''}
                                <button class="btn btn-primary btn-small" onclick="app.editMedicine(${medicine.id})">
                                    ✏️ Edit
                                </button>
                                <button class="btn btn-danger btn-small" onclick="app.deleteMedicine(${medicine.id})">
                                    🗑️ Delete
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            renderHistory() {
                const container = document.getElementById('historyList');
                if (this.history.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div>📋🎈</div>
                            <h3>No history yet!</h3>
                            <p>Your colorful journey starts here ✨</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = this.history.map(entry => `
                    <div class="medicine-card">
                        <div class="medicine-header">
                            <div>
                                <div class="medicine-name">${entry.name} (${entry.dosage})</div>
                                <div style="font-size: 16px; color: #636e72;">
                                    ${entry.action === 'taken' ? '✅ Took it!' : '❌ Missed'}
                                </div>
                            </div>
                            <div style="text-align: right;">
                                <div class="medicine-time">${entry.time}</div>
                                <div style="font-size: 14px; color: #95a5a6;">${entry.timestamp}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            saveData() {
                localStorage.setItem('medicines', JSON.stringify(this.medicines));
                localStorage.setItem('history', JSON.stringify(this.history));
            }

            showNotification(title, message) {
                const notif = document.getElementById('notification');
                document.getElementById('notifTitle').textContent = title;
                document.getElementById('notifMessage').textContent = message;
                notif.classList.add('show');
                this.vibratePattern([100, 50, 100]);
                setTimeout(() => {
                    notif.classList.remove('show');
                }, 5000);
            }
        }

        // Global app instance
        const app = new MedicineReminder();

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'home') {
                app.renderMedicines();
            } else if (tabName === 'history') {
                app.renderHistory();
            }
        }

        // Service Worker for background alarms (PWA ready)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript;base64,...');
        }
    </script>
</body>
</html>
