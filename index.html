<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Reminder - Login & Register</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Left Side - Illustration -->
        <div class="left-panel">
            <div class="illustration">
                <i class="fas fa-pills icon-large"></i>
                <h1>MediCare Reminder</h1>
                <p>Never miss your medicine again. Stay healthy, stay reminded!</p>
            </div>
        </div>

        <!-- Right Side - Forms -->
        <div class="right-panel">
            <!-- Login Form -->
            <div class="form-container active" id="loginForm">
                <div class="form-header">
                    <h2>Welcome Back!</h2>
                    <p>Sign in to your MediCare account</p>
                </div>
                
                <form id="loginFormElement">
                    <div class="input-group">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="loginName" placeholder="Enter your name" required>
                        <span class="error-message" id="loginNameError"></span>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                        <span class="eye-icon" id="loginEye">
                            <i class="fas fa-eye"></i>
                        </span>
                        <span class="error-message" id="loginPasswordError"></span>
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <span>Login</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <div class="form-footer">
                    <p>Don't have an account? <span class="switch-link" onclick="showRegister()">Register here</span></p>
                </div>
            </div>

            <!-- Register Form -->
            <div class="form-container" id="registerForm">
                <div class="form-header">
                    <h2>Create Account</h2>
                    <p>Join MediCare Reminder today</p>
                </div>
                
                <form id="registerFormElement">
                    <div class="input-group">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="regName" placeholder="Full Name" required>
                        <span class="error-message" id="regNameError"></span>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-calendar input-icon"></i>
                        <input type="number" id="regAge" placeholder="Age" min="1" max="120" required>
                        <span class="error-message" id="regAgeError"></span>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-notes-medical input-icon"></i>
                        <input type="text" id="regCondition" placeholder="Medical Condition/Notes (optional)">
                        <span class="error-message" id="regConditionError"></span>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="regPassword" placeholder="Create Password" required>
                        <span class="eye-icon" id="regEye">
                            <i class="fas fa-eye"></i>
                        </span>
                        <span class="error-message" id="regPasswordError"></span>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>
                        <span class="eye-icon" id="regConfirmEye">
                            <i class="fas fa-eye"></i>
                        </span>
                        <span class="error-message" id="regConfirmPasswordError"></span>
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <span>Create Account</span>
                        <i class="fas fa-user-plus"></i>
                    </button>
                </form>

                <div class="form-footer">
                    <p>Already have an account? <span class="switch-link" onclick="showLogin()">Login here</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <i class="fas fa-check-circle success-icon"></i>
            <h3>Success!</h3>
            <p id="successMessage">Welcome to MediCare Reminder!</p>
            <button class="btn-success" onclick="goToDashboard()">Go to Dashboard</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
