<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 MediBuddy - Fun Medicine Reminder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24, #f0932b, #eb4d4b);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            overflow: hidden;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .nav-tabs {
            display: flex;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }

        .tab {
            flex: 1;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            border-bottom: 4px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        .tab:hover::before {
            left: 100%;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom-color: #667eea;
            box-shadow: 0 -5px 20px rgba(102, 126, 234, 0.3);
        }

        .tab-content {
            padding: 30px;
            display: none;
            min-height: 400px;
        }

        .tab-content.active {
            display: block;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }

        input, select {
            width: 100%;
            padding: 18px 20px;
            border: 3px solid #e8f0fe;
            border-radius: 15px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
            background: rgba(255,255,255,0.8);
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .time-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .calendar-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            padding: 18px 30px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(17, 153, 142, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(240, 147, 251, 0.4);
        }

        .medicine-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .medicine-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        .medicine-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1);
        }

        .medicine-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .medicine-name {
            font-size: 22px;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .medicine-time {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .medicine-date {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .medicine-dosage {
            color: #555;
            font-size: 16px;
            font-weight: 500;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .status-upcoming { 
            background: linear-gradient(135deg, #ffeaa7, #fab1a0); 
            color: #2d3436; 
        }
        .status-due { 
            background: linear-gradient(135deg, #fdcb6e, #e17055); 
            color: white;
            animation: pulse 2s infinite;
        }
        .status-taken { 
            background: linear-gradient(135deg, #00b894, #00cec9); 
            color: white; 
        }
        .status-missed { 
            background: linear-gradient(135deg, #e17055, #d63031); 
            color: white;
            animation: shake 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-small {
            padding: 12px;
            font-size: 14px;
            border-radius: 12px;
        }

        /* Calendar Styles */
        .calendar-container {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-nav {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .calendar-day {
            padding: 15px 5px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .calendar-day:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: scale(1.1);
        }

        .calendar-day.today {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
        }

        .calendar-day.has-medicine {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Alarm Modal */
        .alarm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: modalFadeIn 0.3s ease-out;
        }

        .alarm-modal.show {
            display: flex;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .alarm-content {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(255, 107, 107, 0.5);
            animation: alarmPulse 1s infinite;
        }

        @keyframes alarmPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .alarm-emoji {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.6s infinite;
        }

        .alarm-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .alarm-subtitle {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 20px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
            transform: translateX(400px);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            max-width: 320px;
            font-weight: 600;
        }

        .notification.show {
            transform: translateX(0);
        }

        .history-list {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }

        .history-list::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 30px;
            color: #666;
        }

        .empty-state div {
            font-size: 64px;
            display: block;
            margin-bottom: 25px;
            animation: bounce 2s infinite;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .header h1 { font-size: 24px; }
            .action-buttons { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎉 MediBuddy</h1>
            <p>Your Fun Health Companion! 🩺✨</p>
        </div>

        <!-- Navigation -->
        <div class="nav-tabs">
            <div class="tab active" onclick="switchTab('home')">🏠 Home</div>
            <div class="tab" onclick="switchTab('calendar')">📅 Calendar</div>
            <div class="tab" onclick="switchTab('add')">➕ Add</div>
            <div class="tab" onclick="switchTab('history')">📋 History</div>
        </div>

        <!-- Home Tab -->
        <div id="home" class="tab-content active">
            <div id="medicines-list">
                <div class="empty-state">
                    <div>💊</div>
                    <h3>No medicines yet!</h3>
                    <p>Add your first medicine buddy 🥰</p>
                    <button class="btn btn-primary" onclick="switchTab('add')">Add Medicine Now!</button>
                </div>
            </div>
        </div>

        <!-- Calendar Tab -->
        <div id="calendar" class="tab-content">
            <div class="calendar-container">
                <div class="calendar-header">
                    <button class="calendar-nav" onclick="currentMonth.prev()">‹</button>
                    <h3 id="currentMonth"></h3>
                    <button class="calendar-nav" onclick="currentMonth.next()">›</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
            <div id="calendar-medicines"></div>
        </div>

        <!-- Add Medicine Tab -->
        <div id="add" class="tab-content">
            <form id="medicineForm">
                <div class="form-group">
                    <label>💊 Medicine Name *</label>
                    <input type="text" id="medicineName" placeholder="e.g., Vitamin C" required>
                </div>
                
                <div class="form-group">
                    <label>💊 Dosage *</label>
                    <input type="text" id="dosage" placeholder="e.g., 1 tablet, 500mg" required>
                </div>

                <div class="form-group">
                    <label>🕐 Time *</label>
                    <div class="time-group">
                        <input type="time" id="time" required>
                        <select id="repeat">
                            <option value="daily">🔄 Daily</option>
                            <option value="weekly">📅 Weekly</option>
                            <option value="once">📅 Once</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>📅 Start Date</label>
                    <div class="calendar-group">
                        <input type="date" id="startDate">
                        <select id="days">
                            <option value="1">1 Day</option>
                            <option value="3">3 Days</option>
                            <option value="7">1 Week</option>
                            <option value="30">1 Month</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">🎉 Add Medicine Buddy!</button>
            </form>
        </div>

        <!-- History Tab -->
        <div id="history" class="tab-content">
            <div class="history-list" id="historyList">
                <div class="empty-state">
                    <div>📋</div>
                    <h3>No history yet!</h3>
                    <p>Your medicine adventures will appear here ✨</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Alarm Modal -->
    <div id="alarmModal" class="alarm-modal">
        <div class="alarm-content">
            <div class="alarm-emoji" id="alarmEmoji">⏰</div>
            <div class="alarm-title" id="alarmTitle">Time for Medicine!</div>
            <div class="alarm-subtitle" id="alarmSubtitle"></div>
            <button class="btn btn-success" onclick="dismissAlarm()" style="margin-top: 20px;">✅ I Took It!</button>
            <button class="btn btn-warning" onclick="markMissedAlarm()" style="margin-top: 10px;">❌ Skip</button>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification">
        <div id="notifTitle"></div>
        <div id="notifMessage"></div>
    </div>

    <script>
        class MediBuddy {
            constructor() {
                this.medicines = JSON.parse(localStorage.getItem('medicines')) || [];
                this.history = JSON.parse(localStorage.getItem('history')) || [];
                this.alarmActive = false;
                this.init();
            }

            init() {
                this.renderMedicines();
                this.renderHistory();
                this.renderCalendar();
                this.bindEvents();
                this.startAlarmSystem();
                this.updateClock();
            }

            bindEvents() {
                document.getElementById('medicineForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addMedicine();
                });
            }

            addMedicine() {
                const name = document.getElementById('medicineName').value;
                const dosage = document.getElementById('dosage').value;
                const time = document.getElementById('time').value;
                const repeat = document.getElementById('repeat').value;
                const startDate = document.getElementById('startDate').value || new Date().toISOString().split('T')[0];

                const medicine = {
                    id: Date.now(),
                    name,
                    dosage,
                    time,
                    repeat,
                    startDate,
                    status: 'upcoming',
                    createdAt: new Date().toISOString(),
                    days: parseInt(document.getElementById('days').value)
                };

                this.medicines.unshift(medicine);
                this.saveData();
                this.renderMedicines();
                this.renderCalendar();
                this.showNotification('🎉 Welcome!', `${name} is now your medicine buddy!`);
                
                document.getElementById('medicineForm').reset();
                switchTab('home');
            }

            markTaken(id) {
                const medicine = this.medicines.find(m => m.id === id);
                if (medicine) {
                    medicine.status = 'taken';
                    this.addToHistory(medicine, 'taken');
                    this.saveData();
                    this.renderMedicines();
                    this.playSound('success');
                }
            }

            markMissed(id) {
                const medicine = this.medicines.find(m => m.id === id);
                if (medicine) {
                    medicine.status = 'missed';
                    this.addToHistory(medicine, 'missed');
                    this.saveData();
                    this.renderMedicines();
                    this.playSound('missed');
                }
            }

            deleteMedicine(id) {
                this.medicines = this.medicines.filter(m => m.id !== id);
                this.saveData();
                this.renderMedicines();
                this.renderCalendar();
            }

            editMedicine(id) {
                const medicine = this.medicines.find(m => m.id === id);
                if (medicine) {
                    document.getElementById('medicineName').value = medicine.name;
                    document.getElementById('dosage').value = medicine.dosage;
                    document.getElementById('time').value = medicine.time;
                    document.getElementById('repeat').value = medicine.repeat;
                    document.getElementById('startDate').value = medicine.startDate;
                    this.deleteMedicine(id);
                    switchTab('add');
                }
            }

            addToHistory(medicine, action) {
                this.history.unshift({
                    ...medicine,
                    action,
                    timestamp: new Date().toLocaleString()
                });
                if (this.history.length > 200) {
                    this.history = this.history.slice(0, 200);
                }
            }

            startAlarmSystem() {
                // Check every 30 seconds
                setInterval(() => this.checkAlarms(), 30000);
                // More precise check every minute
                setInterval(() => this.checkAlarms(), 60000);
            }

            checkAlarms() {
                if (this.alarmActive) return;

                const now = new Date();
                this.medicines.forEach(medicine => {
                    if (medicine.status === 'taken' || medicine.status === 'missed') return;

                    const [hours, minutes] = medicine.time.split(':');
                    const alarmTime = new Date();
                    alarmTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
                    
                    // Check if today is valid date for this medicine
                    if (!this.isValidDateForMedicine(medicine, now)) return;

                    const timeDiff = alarmTime - now;
                    
                    // Alarm window: 2 minutes before to 5 minutes after
                    if (timeDiff <= 2 * 60 * 1000 && timeDiff > -5 * 60 * 1000) {
                        this.triggerAlarm(medicine);
                    }
                });
            }

            isValidDateForMedicine(medicine, date) {
                const start = new Date(medicine.startDate);
                const today = new Date(date);
                today.setHours(0,0,0,0);
                start.setHours(0,0,0,0);
                
                const daysDiff = (today - start) / (1000 * 60 * 60 * 24);
                return daysDiff >= 0 && daysDiff <= medicine.days;
            }

            triggerAlarm(medicine) {
                this.alarmActive = true;
                document.getElementById('alarmEmoji').textContent = '⏰💊';
                document.getElementById('alarmTitle').textContent = `Time for ${medicine.name}!`;
                document.getElementById('alarmSubtitle').textContent = `${medicine.dosage} • ${medicine.time}`;
                
                document.getElementById('alarmModal').classList.add('show');
                
                // Play alarm sound and vibrate
                this.playAlarmSound();
                this.vibrateAlarm();
                
                // Update medicine status
                medicine.status = 'due';
                this.saveData();
                this.renderMedicines();
            }

            dismissAlarm() {
                this.alarmActive = false;
                document.getElementById('alarmModal').classList.remove('show');
                // Find the due medicine and mark as taken
                const dueMedicine = this.medicines.find(m => m.status === 'due');
                if (dueMedicine) {
                    this.markTaken(dueMedicine.id);
                }
            }

            markMissedAlarm() {
                this.alarmActive = false;
                document.getElementById('alarmModal').classList.remove('show');
                const dueMedicine = this.medicines.find(m => m.status === 'due');
                if (dueMedicine) {
                    this.markMissed(dueMedicine.id);
                }
            }

            playAlarmSound() {
                // Multiple fun alarm sounds
                const sounds = [
                    'data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAo', // Beep
                    'data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAo' // Different tone
                ];
                
                const audio = new Audio(sounds[Math.floor(Math.random() * sounds.length)]);
                audio.loop = true;
                audio.play().catch(() => {});
                
                // Stop after modal closes
                document.getElementById('alarmModal').addEventListener('transitionend', () => {
                    audio.pause();
                    audio.currentTime = 0;
                }, { once: true });
            }

            vibrateAlarm() {
                if (navigator.vibrate) {
                    // Vibrate pattern: 200ms on, 100ms off, repeat
                    navigator.vibrate([200, 100, 200, 100, 200]);
                }
            }

            playSound(type) {
                const sounds = {
                    success: 'data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAo',
                    missed: 'data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAo'
                };
                const audio = new Audio(sounds[type] || sounds.success);
                audio.play().catch(() => {});
            }

            getStatusClass(status) {
                return `status-${status}`;
            }

            getStatusBadge(status) {
                const labels = {
                    upcoming: '🎉 Upcoming',
                    due: '🚨 DUE NOW',
                    taken: '✅ Taken',
                    missed: '❌ Missed'
                };
                return `<span class="status-badge ${this.getStatusClass(status)}">${labels[status] || status}</span>`;
            }

            renderMedicines() {
                const container = document.getElementById('medicines-list');
                if (this.medicines.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div>💊</div>
                            <h3>No medicines yet!</h3>
                            <p>Add your first medicine buddy 🥰</p>
                            <button class="btn btn-primary" onclick="switchTab('add')">Add Medicine Now!</button>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = this.medicines.map(medicine => {
                    const today = new Date().toLocaleDateString();
                    return `
                        <div class="medicine-card">
                            <div class="medicine-header">
                                <div>
                                    <div class="medicine-name">${medicine.name}</div>
                                    <div class="medicine-dosage">${medicine.dosage}</div>
                                    <div class="medicine-date">📅 ${today} • ${medicine.repeat}</div>
                                </div>
                                <div class="medicine-time">${medicine.time}</div>
                            </div>
                            ${this.getStatusBadge(medicine.status)}
                            
                            <div class="action-buttons">
                                ${medicine.status === 'taken' || medicine.status === 'missed' ? '' : `
                                    <button class="btn btn-success btn-small" onclick="app.markTaken(${medicine.id})">
                                        ✅ Took It!
                                    </button>
                                    <button class="btn btn-danger btn-small" onclick="app.markMissed(${medicine.id})">
                                        ❌ Missed
                                    </button>
                                `}
                                <button class="btn btn-primary btn-small" onclick="app.editMedicine(${medicine.id})">
                                    ✏️ Edit
                                </button>
                                <button class="btn btn-warning btn-small" onclick="app.deleteMedicine(${medicine.id})">
                                    🗑️ Delete
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            renderHistory() {
                const container = document.getElementById('historyList');
                if (this.history.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div>📋</div>
                            <h3>No history yet!</h3>
                            <p>Your medicine adventures will appear here ✨</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = this.history.slice(0, 20).map(entry => `
                    <div class="medicine-card">
                        <div class="medicine-header">
                            <div>
                                <div class="medicine-name">${entry.name} (${entry.dosage})</div>
                                <div style="font-size: 14px; color: #666;">
                                    ${entry.action === 'taken' ? '✅ Taken' : '❌ Missed'}
                                </div>
                            </div>
                            <div style="text-align: right;">
                                <div class="medicine-time">${entry.time}</div>
                                <div style="font-size: 12px; color: #999;">${entry.timestamp}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            saveData() {
                localStorage.setItem('medicines', JSON.stringify(this.medicines));
                localStorage.setItem('history', JSON.stringify(this.history));
            }

            showNotification(title, message) {
                const notif = document.getElementById('notification');
                document.getElementById('notifTitle').textContent = title;
                document.getElementById('notifMessage').textContent = message;
                notif.classList.add('show');
                setTimeout(() => notif.classList.remove('show'), 4000);
            }

            updateClock() {
                setInterval(() => {
                    const now = new Date();
                    const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                }, 1000);
            }
        }

        // Calendar System
        const currentMonth = {
            year: new Date().getFullYear(),
            month: new Date().getMonth(),
            
            prev() {
                if (this.month === 0) {
                    this.month = 11;
                    this.year--;
                } else {
                    this.month--;
                }
                app.renderCalendar();
            },
            
            next() {
                if (this.month === 11) {
                    this.month = 0;
                    this.year++;
                } else {
                    this.month++;
                }
                app.renderCalendar();
            },
            
            getDaysInMonth() {
                return new Date(this.year, this.month + 1, 0).getDate();
            },
            
            getFirstDay() {
                return new Date(this.year, this.month, 1).getDay();
            }
        };

        function renderCalendar() {
            const monthNames = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];
            
            document.getElementById('currentMonth').textContent = 
                `${monthNames[currentMonth.month]} ${currentMonth.year}`;
            
            const grid = document.getElementById('calendarGrid');
            const daysInMonth = currentMonth.getDaysInMonth();
            const firstDay = currentMonth.getFirstDay();
            
            let html = '';
            
            // Day headers
            const dayHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            dayHeaders.forEach(day => {
                html += `<div class="calendar-day" style="font-weight: 700; color: #667eea;">${day}</div>`;
            });
            
            // Empty days before first day
            for (let i = 0; i < firstDay; i++) {
                html += `<div class="calendar-day"></div>`;
            }
            
            // Days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentMonth.year}-${String(currentMonth.month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const today = new Date().toISOString().split('T')[0];
                const hasMedicine = app.medicines.some(medicine => 
                    app.isValidDateForMedicine(medicine, new Date(dateStr))
                );
                
                let className = '';
                if (dateStr === today) className = 'today';
                else if (hasMedicine) className = 'has-medicine';
                
                html += `<div class="calendar-day ${className}" onclick="showCalendarMedicines('${dateStr}')">${day}</div>`;
            }
            
            grid.innerHTML = html;
        }

        function showCalendarMedicines(date) {
            const medicines = app.medicines.filter(m => 
                app.isValidDateForMedicine(m, new Date(date))
            );
            
            const container = document.getElementById('calendar-medicines');
            if (medicines.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">No medicines scheduled 🥳</p>';
            } else {
                container.innerHTML = medicines.map(m => 
                    `<div class="medicine-card" style="margin-bottom: 15px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <div style="font-size: 18px; font-weight: 600;">${m.name}</div>
                                <div style="color: #666;">${m.dosage} • ${m.time}</div>
                            </div>
                            <span class="status-badge status-${m.status}">${app.getStatusBadge(m.status).replace(/<[^>]*>/g, '')}</span>
                        </div>
                    </div>`
                ).join('');
            }
        }

        // Global app instance
        const app = new MediBuddy();
        renderCalendar();

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'home') app.renderMedicines();
            else if (tabName === 'history') app.renderHistory();
            else if (tabName === 'calendar') renderCalendar();
        }

        function dismissAlarm() {
            app.dismissAlarm();
        }

        function markMissedAlarm() {
            app.markMissedAlarm();
        }

        // Service Worker for PWA (optional)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript;base64,...');
        }

        // Request permissions
        if ('Notification' in window) {
            Notification.requestPermission();
        }
        if ('vibrate' in navigator) {
            // Vibration supported
        }
    </script>
</body>
</html>
