<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare - Medicine Reminder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .nav-tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            background: white;
            color: #4facfe;
            border-bottom-color: #4facfe;
        }

        .tab-content {
            padding: 30px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4facfe;
        }

        .time-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .medicine-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #4facfe;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .medicine-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .medicine-name {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }

        .medicine-time {
            color: #4facfe;
            font-weight: 600;
            font-size: 16px;
        }

        .medicine-dosage {
            color: #666;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 8px;
            flex: 1;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-upcoming { background: #fff3cd; color: #856404; }
        .status-due { background: #f8d7da; color: #721c24; }
        .status-taken { background: #d4edda; color: #155724; }

        .history-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state i {
            font-size: 48px;
            display: block;
            margin-bottom: 20px;
            color: #ddd;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 20px;
            background: #4facfe;
            color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.4);
            transform: translateX(400px);
            transition: transform 0.3s;
            z-index: 1000;
            max-width: 300px;
        }

        .notification.show {
            transform: translateX(0);
        }

        @media (max-width: 480px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🩺 MediCare</h1>
            <p>Your health, our priority</p>
        </div>

        <div class="nav-tabs">
            <div class="tab active" onclick="switchTab('home')">Home</div>
            <div class="tab" onclick="switchTab('add')">Add Medicine</div>
            <div class="tab" onclick="switchTab('history')">History</div>
        </div>

        <!-- Home Tab -->
        <div id="home" class="tab-content active">
            <div id="medicines-list">
                <div class="empty-state">
                    <div>💊</div>
                    <h3>No medicines added yet</h3>
                    <p>Add your first medicine to get started</p>
                    <button class="btn btn-primary" onclick="switchTab('add')">Add Medicine</button>
                </div>
            </div>
        </div>

        <!-- Add Medicine Tab -->
        <div id="add" class="tab-content">
            <form id="medicineForm">
                <div class="form-group">
                    <label>Medicine Name *</label>
                    <input type="text" id="medicineName" placeholder="e.g., Paracetamol" required>
                </div>
                
                <div class="form-group">
                    <label>Dosage *</label>
                    <input type="text" id="dosage" placeholder="e.g., 500mg, 1 tablet" required>
                </div>

                <div class="form-group">
                    <label>Time *</label>
                    <div class="time-group">
                        <input type="time" id="time" required>
                        <select id="repeat">
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Add Reminder</button>
            </form>
        </div>

        <!-- History Tab -->
        <div id="history" class="tab-content">
            <div class="history-list" id="historyList">
                <div class="empty-state">
                    <div>📋</div>
                    <h3>No history yet</h3>
                    <p>Your medicine history will appear here</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification">
        <strong id="notifTitle"></strong>
        <p id="notifMessage"></p>
    </div>

    <script>
        class MedicineReminder {
            constructor() {
                this.medicines = JSON.parse(localStorage.getItem('medicines')) || [];
                this.history = JSON.parse(localStorage.getItem('history')) || [];
                this.init();
            }

            init() {
                this.renderMedicines();
                this.renderHistory();
                this.checkNotifications();
                this.bindEvents();
                // Check notifications every minute
                setInterval(() => this.checkNotifications(), 60000);
            }

            bindEvents() {
                document.getElementById('medicineForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addMedicine();
                });
            }

            addMedicine() {
                const name = document.getElementById('medicineName').value;
                const dosage = document.getElementById('dosage').value;
                const time = document.getElementById('time').value;
                const repeat = document.getElementById('repeat').value;

                const medicine = {
                    id: Date.now(),
                    name,
                    dosage,
                    time,
                    repeat,
                    status: 'upcoming',
                    createdAt: new Date().toISOString()
                };

                this.medicines.unshift(medicine);
                this.saveData();
                this.renderMedicines();
                this.showNotification('Medicine Added', `${name} reminder has been set!`);
                
                // Reset form
                document.getElementById('medicineForm').reset();
                switchTab('home');
            }

            markTaken(id) {
                const medicine = this.medicines.find(m => m.id === id);
                if (medicine) {
                    medicine.status = 'taken';
                    this.addToHistory(medicine, 'taken');
                    this.saveData();
                    this.renderMedicines();
                }
            }

            markMissed(id) {
                const medicine = this.medicines.find(m => m.id === id);
                if (medicine) {
                    medicine.status = 'missed';
                    this.addToHistory(medicine, 'missed');
                    this.saveData();
                    this.renderMedicines();
                }
            }

            deleteMedicine(id) {
                this.medicines = this.medicines.filter(m => m.id !== id);
                this.saveData();
                this.renderMedicines();
            }

            editMedicine(id) {
                const medicine = this.medicines.find(m => m.id === id);
                if (medicine) {
                    document.getElementById('medicineName').value = medicine.name;
                    document.getElementById('dosage').value = medicine.dosage;
                    document.getElementById('time').value = medicine.time;
                    document.getElementById('repeat').value = medicine.repeat;
                    this.deleteMedicine(id);
                    switchTab('add');
                }
            }

            addToHistory(medicine, action) {
                this.history.unshift({
                    ...medicine,
                    action,
                    timestamp: new Date().toLocaleString()
                });
                // Keep only last 100 entries
                if (this.history.length > 100) {
                    this.history = this.history.slice(0, 100);
                }
            }

            checkNotifications() {
                const now = new Date();
                this.medicines.forEach(medicine => {
                    if (medicine.status !== 'taken') {
                        const [hours, minutes] = medicine.time.split(':');
                        const reminderTime = new Date();
                        reminderTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
                        
                        const timeDiff = reminderTime - now;
                        if (timeDiff <= 5 * 60 * 1000 && timeDiff > 0) { // 5 minutes window
                            this.showNotification('⏰ Time for Medicine!', 
                                `Take ${medicine.name} (${medicine.dosage}) now!`);
                            medicine.status = 'due';
                            this.saveData();
                            this.renderMedicines();
                        }
                    }
                });
            }

            getStatusClass(status) {
                return `status-${status}`;
            }

            getStatusBadge(status) {
                const labels = {
                    upcoming: 'Upcoming',
                    due: 'Due Now',
                    taken: 'Taken'
                };
                return `<span class="status-badge ${this.getStatusClass(status)}">${labels[status] || status}</span>`;
            }

            renderMedicines() {
                const container = document.getElementById('medicines-list');
                if (this.medicines.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div>💊</div>
                            <h3>No medicines added yet</h3>
                            <p>Add your first medicine to get started</p>
                            <button class="btn btn-primary" onclick="switchTab('add')">Add Medicine</button>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = this.medicines.map(medicine => `
                    <div class="medicine-card">
                        <div class="medicine-header">
                            <div>
                                <div class="medicine-name">${medicine.name}</div>
                                <div class="medicine-dosage">${medicine.dosage} • ${medicine.repeat}</div>
                            </div>
                            <div class="medicine-time">${medicine.time}</div>
                        </div>
                        ${this.getStatusBadge(medicine.status)}
                        
                        <div class="action-buttons">
                            ${medicine.status !== 'taken' ? `
                                <button class="btn btn-success btn-small" onclick="app.markTaken(${medicine.id})">
                                    ✅ Taken
                                </button>
                                <button class="btn btn-danger btn-small" onclick="app.markMissed(${medicine.id})">
                                    ❌ Missed
                                </button>
                            ` : ''}
                            <button class="btn btn-primary btn-small" onclick="app.editMedicine(${medicine.id})">
                                ✏️ Edit
                            </button>
                            <button class="btn btn-danger btn-small" onclick="app.deleteMedicine(${medicine.id})">
                                🗑️ Delete
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            renderHistory() {
                const container = document.getElementById('historyList');
                if (this.history.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div>📋</div>
                            <h3>No history yet</h3>
                            <p>Your medicine history will appear here</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = this.history.map(entry => `
                    <div class="medicine-card">
                        <div class="medicine-header">
                            <div>
                                <div class="medicine-name">${entry.name} (${entry.dosage})</div>
                                <div style="font-size: 14px; color: #666;">
                                    ${entry.action === 'taken' ? '✅ Taken' : '❌ Missed'}
                                </div>
                            </div>
                            <div style="text-align: right;">
                                <div class="medicine-time">${entry.time}</div>
                                <div style="font-size: 12px; color: #999;">${entry.timestamp}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            saveData() {
                localStorage.setItem('medicines', JSON.stringify(this.medicines));
                localStorage.setItem('history', JSON.stringify(this.history));
            }

            showNotification(title, message) {
                const notif = document.getElementById('notification');
                document.getElementById('notifTitle').textContent = title;
                document.getElementById('notifMessage').textContent = message;
                notif.classList.add('show');
                setTimeout(() => {
                    notif.classList.remove('show');
                }, 4000);
            }
        }

        // Global app instance
        const app = new MedicineReminder();

        function switchTab(tabName) {
            // Remove active class from all tabs and content
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // Add active class to clicked tab and content
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            // Refresh content
            if (tabName === 'home') {
                app.renderMedicines();
            } else if (tabName === 'history') {
                app.renderHistory();
            }
        }

        // Request notification permission
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Play notification sound (simple beep)
        function playNotificationSound() {
            const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAo');
            audio.play().catch(() => {});
        }
    </script>
</body>
</html>
