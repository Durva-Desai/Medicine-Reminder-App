<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare Reminder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .content {
            padding: 40px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 0;
            transition: transform 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .toggle-link {
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
        }
        .dashboard {
            display: none;
        }
        .dashboard.show {
            display: block;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .stat {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        .med-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        .med-form input:nth-child(3) {
            grid-column: span 2;
        }
        .med-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .med-item {
            background: #f8f9fa;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .med-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-small {
            padding: 8px 15px;
            font-size: 14px;
            flex: 1;
        }
        .hidden { display: none; }
        @media (max-width: 600px) {
            .med-form { grid-template-columns: 1fr; }
            .med-form input:nth-child(3) { grid-column: span 1; }
        }
    </style>
</head>
<body>
    <!-- LOGIN/REGISTER -->
    <div id="authPage" class="container">
        <div class="header">
            <h1>🩺 MediCare Reminder</h1>
            <p>Your Health Companion</p>
        </div>
        <div class="content">
            <!-- LOGIN FORM -->
            <div id="loginForm">
                <form onsubmit="login(event)">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="loginName" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPass" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <p style="text-align: center; margin-top: 20px;">
                    New user? <span class="toggle-link" onclick="showRegister()">Register</span>
                </p>
            </div>

            <!-- REGISTER FORM -->
            <div id="registerForm" class="hidden">
                <form onsubmit="register(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="regName" required>
                    </div>
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="regAge" min="1" max="120" required>
                    </div>
                    <div class="form-group">
                        <label>Health Notes</label>
                        <textarea id="regNotes" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPass" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
                <p style="text-align: center; margin-top: 20px;">
                    Have account? <span class="toggle-link" onclick="showLogin()">Login</span>
                </p>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="container dashboard">
        <div class="header">
            <h1 id="welcome">Welcome!</h1>
            <button class="btn" onclick="logout()">Logout</button>
        </div>
        <div class="content">
            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="totalMeds">0</div>
                    <Total Medicines
                </div>
                <div class="stat">
                    <div class="stat-number" id="todayMeds">0</div>
                    Today's Reminders
                </div>
                <div class="stat">
                    <div class="stat-number" id="adherence">100%</div>
                    Adherence
                </div>
            </div>

            <!-- ADD MEDICINE -->
            <div class="med-form">
                <input type="text" id="medName" placeholder="Medicine name">
                <input type="text" id="medDose" placeholder="Dosage">
                <input type="date" id="medDate">
                <input type="time" id="medTime">
                <button class="btn btn-primary" onclick="addMedicine()">Add Reminder</button>
            </div>

            <!-- MEDICINES LIST -->
            <div class="med-list" id="medList">
                <p style="text-align: center; color: #666;">Add your first medicine</p>
            </div>
        </div>
    </div>

    <script>
        // GLOBAL VARIABLES
        let user = null;
        let medicines = [];

        // PAGE CONTROL
        function showPage(pageId) {
            document.getElementById('authPage').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById(pageId).style.display = 'block';
        }

        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }

        // AUTH FUNCTIONS
        function register(event) {
            event.preventDefault();
            
            const name = document.getElementById('regName').value;
            const age = document.getElementById('regAge').value;
            const notes = document.getElementById('regNotes').value;
            const password = document.getElementById('regPass').value;

            user = { name, age, notes, password };
            localStorage.setItem('user', JSON.stringify(user));
            localStorage.setItem('medicines', JSON.stringify([]));
            
            alert('✅ Registered successfully!');
            goToDashboard();
        }

        function login(event) {
            event.preventDefault();
            
            const savedUser = localStorage.getItem('user');
            if (!savedUser) {
                alert('❌ No account found. Please register first!');
                return;
            }

            const saved = JSON.parse(savedUser);
            const name = document.getElementById('loginName').value;
            const password = document.getElementById('loginPass').value;

            if (saved.name === name && saved.password === password) {
                user = saved;
                medicines = JSON.parse(localStorage.getItem('medicines') || '[]');
                goToDashboard();
            } else {
                alert('❌ Wrong name or password!');
            }
        }

        function goToDashboard() {
            document.getElementById('welcome').textContent = `Welcome, ${user.name}! 👋`;
            document.getElementById('medDate').valueAsDate = new Date();
            updateStats();
            renderMedicines();
            showPage('dashboard');
        }

        function logout() {
            user = null;
            medicines = [];
            showPage('authPage');
            showLogin();
        }

        // MEDICINE FUNCTIONS
        function addMedicine() {
            const name = document.getElementById('medName').value;
            const dose = document.getElementById('medDose').value;
            const date = document.getElementById('medDate').value;
            const time = document.getElementById('medTime').value;

            if (!name || !dose || !date || !time) {
                alert('❌ Please fill all fields!');
                return;
            }

            const med = {
                id: Date.now(),
                name, dose, date, time,
                taken: false
            };

            medicines.unshift(med);
            saveMedicines();
            renderMedicines();
            updateStats();
            clearMedForm();
            alert('✅ Medicine added!');
        }

        function deleteMed(id) {
            medicines = medicines.filter(m => m.id !== id);
            saveMedicines();
            renderMedicines();
            updateStats();
        }

        function toggleTaken(id) {
            const med = medicines.find(m => m.id === id);
            if (med) med.taken = !med.taken;
            saveMedicines();
            renderMedicines();
            updateStats();
        }

        function saveMedicines() {
            localStorage.setItem('medicines', JSON.stringify(medicines));
        }

        function renderMedicines() {
            const container = document.getElementById('medList');
            if (medicines.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">Add your first medicine</p>';
                return;
            }

            container.innerHTML = medicines.map(med => `
                <div class="med-item">
                    <h3>${med.name}</h3>
                    <p>${med.dose} | ${med.date} ${med.time}</p>
                    <div class="med-actions">
                        <button class="btn-small ${med.taken ? 'btn btn-danger' : 'btn btn-primary'}" 
                                onclick="toggleTaken(${med.id})">
                            ${med.taken ? 'Missed' : 'Taken'}
                        </button>
                        <button class="btn-small btn btn-danger" onclick="deleteMed(${med.id})">
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const total = medicines.length;
            const today = medicines.filter(m => m.date === new Date().toISOString().split('T')[0]).length;
            const taken = medicines.filter(m => m.taken).length;
            const rate = total ? Math.round((taken/total)*100) : 0;

            document.getElementById('totalMeds').textContent = total;
            document.getElementById('todayMeds').textContent = today;
            document.getElementById('adherence').textContent = rate + '%';
        }

        function clearMedForm() {
            document.getElementById('medName').value = '';
            document.getElementById('medDose').value = '';
            document.getElementById('medDate').value = '';
            document.getElementById('medTime').value = '';
        }

        // AUTO-CHECK REMINDERS
        setInterval(() => {
            const now = new Date();
            const today = now.toISOString().split('T')[0];
            medicines.forEach(med => {
                if (!med.taken && med.date === today) {
                    const [h, m] = med.time.split(':');
                    const medTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m);
                    if (Math.abs(now - medTime) < 2*60*1000) { // 2 min window
                        alert(`⏰ Time for ${med.name}!`);
                    }
                }
            });
        }, 60000);

        // INIT
        document.getElementById('medDate').valueAsDate = new Date();
    </script>
</body>
</html>
